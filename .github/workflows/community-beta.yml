name: Publicar beta comunitaria v1.3.6-community.1-beta.1
on:
  push:
    branches: [master]
    paths:
      - 'docs/BETA-PUBLICACION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-beta-release-1
  cancel-in-progress: false

jobs:
  validate:
    name: Seguridad, traducciones y pruebas ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar base y empaquetador
        run: |
          set -euo pipefail
          python3 scripts/check_security.py
          python3 scripts/check_translations.py
          python3 scripts/test_release_package.py
      - name: Probar extracción ZIP
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libminizip-dev zlib1g-dev
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/zip_path.cpp -o /tmp/awoo-zip-path
          /tmp/awoo-zip-path
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/zip_cli.cpp source/util/unzip.cpp -lminizip -lz -o /tmp/awoo-zip-cli
          python3 scripts/test_zip_integration.py /tmp/awoo-zip-cli

  build:
    name: Compilar beta para Nintendo Switch
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Compilar submódulo original y NRO
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DEVKITPRO/libnx/switch_rules"
          make -C include/Plutonium/Plutonium -f Makefile -j2
          test -s include/Plutonium/Plutonium/Output/lib/libpu.a
          make -j2 APP_VERSION=1.3.6-community.1-beta.1
          test -s Awoo-Installer.nro
      - uses: actions/upload-artifact@v4
        with:
          name: beta-nro
          path: Awoo-Installer.nro
          if-no-files-found: error
          retention-days: 30

  package:
    name: Empaquetar y verificar SHA-256
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: beta-nro
          path: dist
      - name: Empaquetar y comprobar integridad
        run: |
          set -euo pipefail
          python3 scripts/package_release.py dist/Awoo-Installer.nro dist
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: beta-distribution
          path: |
            dist/Awoo-Installer.nro
            dist/Awoo-Installer.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publicar pre-release, nunca estable
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: beta-distribution
          path: dist
      - name: Publicar beta pública tras validar artefactos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v1.3.6-community.1-beta.1
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          cd ..
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La beta ya existe: no sobrescribir una release pública."
            exit 1
          fi
          gh release create "$TAG" \
            dist/Awoo-Installer.nro dist/Awoo-Installer.zip dist/SHA256SUMS \
            --prerelease --target "$GITHUB_SHA" \
            --title "Awoo Installer Community v1.3.6-community.1-beta.1 (Beta pública sin pruebas en consola)" \
            --notes-file docs/BETA-PUBLICACION.md
          gh release view "$TAG" --json isPrerelease,isDraft,tagName,url --jq '{tag:.tagName,pre_release:.isPrerelease,draft:.isDraft,url:.url}'
